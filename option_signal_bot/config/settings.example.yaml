# نمونه تنظیمات — این فایل را به `config/settings.yaml` کپی و مقادیر واقعی را جایگزین کنید.
# ⚠️ هیچ توکن یا مقدار واقعی در این فایل نگذارید؛ `settings.yaml` در .gitignore است.

general:
  log_level: INFO              # DEBUG | INFO | WARNING | ERROR
  poll_interval_seconds: 300   # فاصله هر پاس رصد بازار
  run_only_when_market_open: true

market_data:
  # این پروژه داده‌ی ساختگی ندارد؛ هر دو provider واقعی‌اند.
  # tsetmc = داده واقعی از API عمومی TSETMC (بدون نیاز به لاگین یا توکن)
  # pytse  = کتابخانه pytse-client
  provider: tsetmc
  # فقط نمادهایی که آپشن دارند. لیست به‌روز را ببینید با:
  #   python scripts/fetch_tsetmc_sample.py
  symbols:
    - خودرو
    - اهرم
    - شستا
  history_days: 90
  risk_free_rate: 0.28         # نرخ بهره بدون ریسک سالانه (اعشاری)
  history_ttl_seconds: 900     # کش تاریخچه (فقط provider=tsetmc)
  # پوشه‌ی تاریخچه‌ی ضبط‌شده. اگر داده شود، تاریخچه از دیسک
  # خوانده می‌شود نه شبکه — همان چیزی که تست‌ها استفاده می‌کنند.
  # history_dir: tests/fixtures/history

option_chain:
  # tsetmc  = زنجیره واقعی از دیده‌بان بازار آپشن TSETMC (یک درخواست، کل بازار)
  # fixture = پخش یک پاسخ ضبط‌شده (تست آفلاین / بازتولید یک روز خاص)
  #
  # چرا ایزی‌تریدر گزینه‌ی زنجیره نیست: مشخصات قرارداد را فقط تک‌به‌تک
  # می‌دهد (~۱۳۸۶ درخواست برای کل بازار، حدود ۷ دقیقه). به‌جایش با
  # enrich_with_broker روی همین زنجیره سوار می‌شود.
  provider: tsetmc

  # غنی‌سازی با کارگزاری: وجه تضمین و اندازه‌ی دقیق قرارداد را از
  # ایزی‌تریدر می‌گیرد. نیازمند broker.enabled و توکن معتبر.
  enrich_with_broker: false
  enrich_limit: 20            # چند قرارداد نزدیک به قیمت پایه غنی شود
  market: 0                    # 0=همه، 1=بورس، 2=فرابورس
  cache_ttl_seconds: 20        # کش پاسخ؛ همه نمادهای یک پاس از آن تغذیه می‌شوند
  timeout: 15
  retries: 3

  # گیت‌های کیفیت داده: بازار واقعی پر از نمادهای مرده است و بدون این‌ها
  # استراتژی روی قیمت بی‌معنا سیگنال می‌دهد.
  quality:
    require_quote: true          # حداقل یک سمت مظنه یا یک معامله
    max_relative_spread: 0.35    # اسپرد نسبی بیشتر از این رد می‌شود (null = بی‌حد)
    drop_zero_open_interest: true
    min_days_to_expiry: 3        # سررسیدهای خیلی نزدیک حذف شوند

  # مخصوص provider=fixture
  # fixture_path: tests/fixtures/tsetmc_option_market_watch.json


signals:
  validity_minutes: 30         # مدت اعتبار هر سیگنال
  dedupe_window_minutes: 60    # تا این مدت سیگنال تکراری صادر نمی‌شود
  min_confidence: null         # مثلاً 0.3 برای فیلتر سیگنال‌های ضعیف

risk:
  # روشن = دارایی حساب از کارگزاری خوانده می‌شود و جای عدد زیر
  # را می‌گیرد. عدد دستی سریع کهنه می‌شود و ریسک را روی دارایی‌ای
  # اندازه می‌گیرد که وجود ندارد. نیاز به broker.enabled دارد.
  use_broker_equity: false
  account_equity: 1000000000   # دارایی حساب به ریال
  risk_per_trade_pct: 1.0      # درصد ریسک در هر معامله
  max_position_pct: 5.0        # سقف درصد دارایی در یک پوزیشن
  max_contracts: 50            # سقف تعداد قرارداد در هر سیگنال
  stop_loss_pct: 35.0          # درصد افت پرمیوم برای حد ضرر پیشنهادی
  take_profit_pct: 70.0        # درصد رشد پرمیوم برای حد سود پیشنهادی
  # کارمزد و مالیات، به‌صورت کسر (۰٫۰۰۱ = ۰٫۱٪).
  #
  # پیش‌فرض صفر است و حدس زده نمی‌شود — همان قاعده‌ای که برای داده‌ی
  # بازار رعایت می‌شود. نرخ واقعی را از کارگزاری خودتان بگیرید.
  # با صفر بودن، همه‌ی اعداد دقیقاً مثل قبل می‌مانند.
  fees:
    buy_rate: 0.0
    sell_rate: 0.0
    sell_tax_rate: 0.0   # مالیات فقط سمت فروش
    per_order: 0.0       # کارمزد ثابت هر سفارش، اگر باشد

strategies:
  # ⚠️ این بخش یک **فهرست سفید** است: هر استراتژی که اینجا نباشد اصلاً
  # ساخته نمی‌شود. قبلاً فقط دو تا اینجا بودند و collar/long_straddle
  # بی‌صدا اجرا نمی‌شدند — بدون هیچ خطا یا هشداری.
  directional_ma_cross:
    enabled: true
    params:
      fast_window: 5
      slow_window: 20
      momentum_window: 10
      min_separation_pct: 0.5
      min_momentum_pct: 2.0
      target_moneyness: 0.05   # ۵٪ OTM
      min_days_to_expiry: 14
      max_days_to_expiry: 90
      min_open_interest: 50
  neutral_iv_spread:
    enabled: true
    params:
      trend_window: 20
      # ⚠️ ۳٪ برای بورس تهران یعنی «هرگز»: انحراف واقعی از MA20 روی
      # نمادهای پرمعامله ۱۰-۱۵٪ اندازه‌گیری شد. با ۳٪ این استراتژی دو
      # روز تمام یک سیگنال هم نداد.
      range_threshold_pct: 12.0
      rich_iv_ratio: 1.30
      cheap_iv_ratio: 0.80
      covered_call_moneyness: 0.08
      min_days_to_expiry: 14
      max_days_to_expiry: 60
      min_open_interest: 50
      enable_covered_call: true
      enable_straddle: true
  # ساختار سه‌پایه: سهم + خرید پوت (کف) + فروش کال (سقف).
  # نیازمند داشتن سهم پایه است.
  collar:
    enabled: true
    params:
      protection_pct: 0.10     # کف حفاظت، ۱۰٪ زیر قیمت
      cap_pct: 0.10            # سقف سود، ۱۰٪ بالای قیمت
      max_net_cost_pct: 0.02   # حداکثر هزینه خالص
      min_days_to_expiry: 21
      max_days_to_expiry: 90
      min_open_interest: 50
      max_relative_spread: 0.30
  # خرید همزمان کال و پوت هم‌استرایک — وقتی IV نسبت به نوسان
  # تاریخی ارزان است و انتظار حرکت بزرگ (در هر دو جهت) داریم.
  long_straddle:
    enabled: true
    params:
      max_iv_to_rv_ratio: 0.95
      rv_window: 30
      max_moneyness_gap: 0.03
      min_days_to_expiry: 21
      max_days_to_expiry: 90
      min_open_interest: 50
      max_relative_spread: 0.25

notifiers:
  console:
    enabled: true
    as_json: false
  telegram:
    enabled: false
    # مقدار واقعی را این‌جا نگذارید؛ از متغیرهای محیطی استفاده کنید:
    #   TELEGRAM_BOT_TOKEN و TELEGRAM_CHAT_ID
    bot_token: "<YOUR_TELEGRAM_BOT_TOKEN>"
    chat_id: "<YOUR_TELEGRAM_CHAT_ID>"
    # دستورهای دوطرفه: /signals، /status، /report، /mute
    # جدا از `enabled` است — کسی می‌تواند اعلان بخواهد ولی ربات
    # دوطرفه نخواهد. فقط دستورهای همین chat_id پذیرفته می‌شود.
    commands_enabled: false
    mute_state_path: var/telegram_mute.json
    # دکمه‌های «اجرا کردم / رد کردم / دیدم» زیر هر سیگنال.
    # در گروه پرعضو خاموشش کنید: هر کسی می‌تواند بزندش.
    ack_buttons: true
    command_state_path: var/telegram_offset.json

storage:
  enabled: true
  # مسیرهای نسبی، نسبت به ریشه پروژه حل می‌شوند. پوشه var/ فقط خروجی اجراست
  # (در .gitignore) تا پوشه‌های کد، کد بمانند.
  sqlite_path: var/signals.db
  jsonl_path: var/signals.jsonl

# تقویم معاملاتی: تعطیلات را از تاریخچه‌ی **واقعی** بازار یاد می‌گیرد،
# نه از یک جدول دستی. تعطیلات قمری (تاسوعا، عاشورا، …) هر سال جابه‌جا
# می‌شوند و جدول دستی هر سال کهنه می‌شود؛ بازار خودش می‌داند.
trading_calendar:
  learn_from_market: true
  # نماد مرجع باید پرمعامله باشد، وگرنه «نبودِ کندل» یعنی توقف نماد نه تعطیلی.
  reference_symbol: خودرو
  learn_days: 365
  cache_path: var/trading_calendar.json
  # تعطیلی اضطراریِ اعلام‌شده که هنوز در تاریخچه نیامده (YYYY-MM-DD)
  extra_holidays: []

# پایش سلامت و گزارش دوره‌ای.
#
# هشدار سلامت پیش‌فرض روشن است چون خرابی‌هایی را می‌گیرد که بی‌صدا
# هستند (قطعی داده، استراتژی مرده، سکوت طولانی) و ربات در همه‌شان
# «سالم» به نظر می‌رسد.
# تاریخچه‌ی IV هر نماد. IV تاریخی از هیچ endpoint عمومی در دست نیست،
# پس هر پاس خودمان ثبتش می‌کنیم تا روزی صدک معنا پیدا کند.
#
# تا نمونه‌ی کافی (min_samples) جمع نشود، صدک None است و استراتژی به
# معیار قبلی (iv/realized) برمی‌گردد — پس روشن بودنش از روز اول هم
# رفتار کسی را عوض نمی‌کند، فقط تاریخچه می‌سازد.
iv_history:
  enabled: true
  path: var/iv_history.json
  max_days: 365
  min_samples: 20

monitoring:
  health_enabled: true
  # گزارش دوره‌ای پیش‌فرض خاموش است: پیام دوره‌ای فرستادن باید
  # انتخاب صریح کاربر باشد. به notifiers.telegram نیاز دارد.
  periodic_report_enabled: false
  # یک هشدار تا این مدت تکرار نمی‌شود (تشدید وضعیت، این را می‌شکند)
  alert_cooldown_hours: 6.0
  alert_state_path: var/health_alerts.json
  report_state_path: var/report_schedule.json
  thresholds:
    drought_warning_days: 3
    drought_critical_days: 7
    # شکست «متوالی» منبع داده؛ یک تایم‌اوت گذرا هشدار نیست
    data_warning_failures: 2
    data_critical_failures: 5
    strategy_error_threshold: 3
    missing_quote_ratio: 0.8

backtest:
  history_days: 180
  horizon_days: 10
  warmup_days: 30
  step_days: 1
  # بدون تعدیل، روز افزایش سرمایه یک ریزش ساختگی است و هر استراتژی
  # تکنیکالی آن را سیگنال نزولی قوی می‌فهمد.
  adjust_corporate_actions: true
  # سود و زیان روی پرمیوم **واقعی** آپشن حساب شود، نه فقط
  # جهت نماد پایه. اهرم و تتا فقط با این دیده می‌شوند.
  use_real_premiums: true

# اجرای سفارش **واقعی** (اتصال به API کارگزاری) هنوز پیاده‌سازی نشده و
# این مقدار باید false بماند؛ نیاز به تصمیم صریح آینده‌ی کاربر دارد.
# معاملات کاغذی (paper_trading پایین) از این جداست.
execution:
  enabled: false

# --- معاملات کاغذی (Paper Trading) ---
# کارگزار شبیه‌سازی‌شده، بدون اتصال واقعی به هیچ کارگزاری. پیش‌فرض خاموش.
# پرشدن سفارش همیشه از عمق واقعی دفتر سفارش TSETMC حساب می‌شود.
# فقط پوزیشن long (خرید برای باز کردن، فروش برای بستن) — بدون فروش استقراضی.
paper_trading:
  enabled: false
  # ریال. معادل ۵۰۰ میلیون تومان.
  initial_balance: 5000000000.0
  sqlite_path: "var/paper_trading.db"
  # کارمزد پیش‌فرض صفر است و حدس زده نمی‌شود (مثل risk.fees پایین‌تر).
  # نرخ واقعی کارگزاری خودتان را اینجا یا از داشبورد وارد کنید.
  fees:
    buy_rate: 0.0
    sell_rate: 0.0
    sell_tax_rate: 0.0
    per_order: 0.0
    # صفرهای بالا «پیش‌فرض» هستند، نه ادعای بی‌هزینه بودن. تا این
    # true نشود، هزینه‌ی معامله‌ها نامعلوم ثبت می‌شود و «سود خالص»
    # به‌عنوان عدد قطعی نمایش داده نمی‌شود — فقط ناخالص.
    # اگر نرخ‌های بالا را خودتان وارد کرده‌اید (حتی اگر صفر باشند)،
    # این را true کنید.
    declared: false
  order_book_ttl_seconds: 10.0

# --- غربال قابلیت معامله ---
# دروازه‌ی ورود به پیشنهادها: قراردادی که نشود از آن خارج شد، هر چقدر
# هم جذاب باشد پیشنهاد نمی‌شود. امتیاز بالا جای امکان خروج را نمی‌گیرد.
#
# ⚠️ این آستانه‌ها **اثبات‌شده نیستند** — نقطه‌ی شروعی محافظه‌کارانه‌اند.
# با تاریخچه‌ی خودتان تنظیمشان کنید.
tradability:
  enabled: true
  min_open_interest_contracts: 50      # قرارداد
  min_trades_today_count: 1            # تعداد معامله‌ی امروز
  max_relative_spread_pct: 25.0        # درصد نسبت به میانه‌ی مظنه
  # عمقِ سمت خروج تقسیم بر اندازه‌ی سفارش. ۱ یعنی دقیقاً به اندازه‌ی
  # سفارش عمق هست؛ بالاتر یعنی حاشیه‌ی اطمینان.
  min_exit_depth_ratio: 1.0
  # حداکثر فاصله‌ی قیمتِ پرشدنِ خروج از بهترین مظنه (درصد). عمق در
  # قیمت‌های دور، سفارش را پر می‌کند ولی با زیانی که خودش معامله را
  # بی‌معنا می‌کند.
  max_exit_slippage_pct: 10.0
  min_sessions_with_trades_pct: 60.0   # درصد جلسه‌های دارای معامله
  # کمتر از این تعداد جلسه‌ی ثبت‌شده یعنی «نیازمند بررسی»، نه «بد».
  min_history_sessions: 5
  min_days_to_expiry: 3                # روز
  max_quote_age_seconds: 120.0         # ثانیه
  # فقط‌خواندنی؛ غربالگر هرگز در این پایگاه نمی‌نویسد.
  history_db_path: "var/recorder/market.db"
  history_lookback_sessions: 20

# --- رتبه‌بندی اولویت بررسی ---
# روی گزینه‌هایی اجرا می‌شود که **از غربال گذشته‌اند**. امتیاز بالا جای
# نقدشوندگی را نمی‌گیرد: گزینه‌ی ردشده اصلاً وارد این فهرست نمی‌شود.
#
# ⚠️ خروجی «امتیاز اولویت بررسی» است — نه احتمال برد، نه بازده مورد
# انتظار، نه توصیه‌ی خرید. وزن‌ها **فرضِ اولیه‌اند** و هیچ پژوهشی
# پشتشان نیست؛ با تجربه‌ی خودتان تنظیمشان کنید.
ranking:
  enabled: true
  # وزن مؤلفه‌ها. جمعشان لازم نیست ۱۰۰ باشد — نسبی‌اند.
  weight_price_cost: 30.0          # نصف اسپرد + لغزش خروج (یک سنجه، نه دو تا)
  weight_exit_capacity: 20.0       # عمق سمت خروج نسبت به اندازه‌ی سفارش
  weight_time_to_expiry: 15.0      # فرصت محقق‌شدن فرض استراتژی
  weight_required_move: 20.0       # حرکت لازم پایه تا سر‌به‌سر
  weight_cost_drag: 5.0            # سهم کارمزد از ارزش موقعیت
  weight_strategy_evidence: 10.0   # کارنامه‌ی محقق‌شده‌ی همین استراتژی
  # نقطه‌ی اشباع هر سنجه: از این بهتر، امتیاز بیشتری نمی‌گیرد.
  depth_comfort_multiple: 3.0      # برابرِ حداقلِ عمقِ غربال
  days_to_expiry_comfort: 30       # روز
  max_required_move_pct: 25.0      # درصد حرکت پایه
  max_cost_drag_pct: 5.0           # درصد از ارزش موقعیت
  # کمتر از این تعداد سیگنالِ نتیجه‌دار، کارنامه «نامعلوم» است — نه «بد».
  min_resolved_signals: 10

# --- اتصال به حساب کارگزاری (فقط خواندن) ---
# غیرفعال است مگر اینکه صریحاً روشنش کنید. حتی وقتی روشن باشد، این پروژه
# هیچ سفارشی ثبت نمی‌کند؛ فقط پوزیشن و مشخصات قرارداد را می‌خواند.
#
# توکن از فایل سشنی می‌آید که 3-discover-api.bat می‌سازد.
# ⚠️ آن فایل معادل دسترسی به حساب شماست؛ جایی نفرستیدش.
broker:
  enabled: false
  provider: emofid
  session_file: var/emofid/session.json
  base_url: https://api-mts.orbis.easytrader.ir
  timeout: 15
  retries: 3

# --- ثبت تاریخچه‌ی خام بازار ---
# ابزار `scripts/record_market.py`. زنجیره‌ی خام بازار را **پیش از**
# فیلترهای کیفیت ثبت می‌کند: قراردادی که امروز بی‌مظنه است فردا ممکن
# است نقدشونده شود، و اگر ثبتش نکنیم آن تاریخچه برای همیشه رفته.
#
# این ابزار از CLI اجرا می‌شود و به حلقه‌ی اصلی ربات وصل نیست؛ حلقه‌ی
# زمان‌بندی در مرحله‌ی بعد اضافه می‌شود. به حساب کارگزاری، تلگرام یا
# لایه‌ی اجرا هیچ وابستگی ندارد.
recorder:
  enabled: false
  sqlite_path: var/recorder/market.db
  # داده‌ی fixture فقط در این پایگاه ثبت می‌شود. مسیر جدا عمدی است و
  # لایه‌ی ذخیره‌سازی هم مستقل از این تنظیم، مخلوط‌شدن را رد می‌کند.
  test_sqlite_path: var/recorder/test.db
  market: 0
  timeout: 15
  retries: 3

  # --- زمان‌بندی (فقط برای حالت --loop) ---
  # نوبت‌ها روی ساعت دیوار هم‌تراز می‌شوند، پس با ۳۰۰ ثانیه روی
  # ۰۹:۰۰، ۰۹:۰۵، … می‌افتند. نوبتی که طول بکشد اسلات بعدی را
  # می‌بلعد و نوبت‌های ازدست‌رفته **جبران نمی‌شوند**.
  interval_seconds: 300
  # تصمیم‌های زمانی با این منطقه گرفته می‌شوند. اگر پایگاه tz در
  # دسترس نباشد، به آفست ثابت +۰۳:۳۰ برمی‌گردد و هشدار می‌دهد.
  timezone: Asia/Tehran
  session_start: "09:00"
  session_end: "12:30"
  # ⚠️ snapshotهای پس از پایان جلسه «قیمت پایانی» نیستند؛ منبع مهر
  # زمانی نمی‌دهد، پس مشاهده‌ی عادی‌اند.
  closing_grace_seconds: 300
